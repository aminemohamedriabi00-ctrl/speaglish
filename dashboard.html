<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#080B18;--card:#0E1120;--card2:#131626;
      --border:#1C2240;--gold:#F0A500;--gold2:#FFD166;
      --teal:#00C9A7;--red:#FF5757;--blue:#4169FF;--purple:#9B6DFF;
      --text:#EEF2FF;--sub:#8896B8;--muted:#3D4A6A;
      --nav-bg:rgba(8,11,24,.88);
      --ff:'Barlow',sans-serif;--fd:'Syne',sans-serif;
    }
    [data-theme="light"]{
      --bg:#F4F6FB;--card:#FFFFFF;--card2:#EDF0F7;
      --border:#D4DAE8;--gold:#D4900A;--gold2:#B87A00;
      --teal:#009982;--red:#D93636;--blue:#2952E3;--purple:#7B4FE0;
      --text:#0D1120;--sub:#4A5578;--muted:#9AA3BA;
      --nav-bg:rgba(244,246,251,.92);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--ff);min-height:100vh;transition:background .25s,color .25s;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 10% 10%,rgba(65,105,255,.07),transparent 70%),radial-gradient(ellipse 50% 40% at 90% 90%,rgba(240,165,0,.05),transparent 70%);}

    /* ── NAV ── */
    .nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px;}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;}
    .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),#E8961A);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:13px;color:#000;overflow:hidden;flex-shrink:0;}
    .logo-text{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--text);}
    .logo-text span{color:var(--gold);}
    .nav-name{font-size:13px;color:var(--sub);font-weight:500;}
    .theme-btn{width:34px;height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;}
    .theme-btn:hover{color:var(--text);border-color:var(--gold);}
    .signout-btn{padding:7px 14px;background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;font-family:var(--ff);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
    .signout-btn:hover{border-color:var(--red);color:var(--red);}

    /* ── STATUS BANNER ── */
    .status-banner{padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .banner-trial{background:rgba(240,165,0,.08);border-bottom:1px solid rgba(240,165,0,.2);}
    .banner-pending{background:rgba(155,109,255,.08);border-bottom:1px solid rgba(155,109,255,.2);}
    .banner-expired{background:rgba(255,87,87,.08);border-bottom:1px solid rgba(255,87,87,.2);}
    .banner-active{display:none;}
    .banner-icon{font-size:20px;flex-shrink:0;}
    .banner-text{flex:1;font-size:13px;line-height:1.5;}
    .banner-text strong{font-weight:700;}
    .banner-btn{padding:8px 18px;border:none;border-radius:8px;font-family:var(--ff);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;text-decoration:none;display:inline-block;}
    .banner-btn-gold{background:var(--gold);color:#000;}
    .banner-btn-gold:hover{background:var(--gold2);}

    /* ── PAGE ── */
    .page{max-width:1100px;margin:0 auto;padding:32px 28px 60px;position:relative;z-index:1;}

    /* ── SECTION HEADER ── */
    .section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
    .section-title{font-family:var(--fd);font-size:17px;font-weight:700;}
    .section-link{font-size:12px;color:var(--gold);text-decoration:none;font-weight:600;}
    .section-link:hover{color:var(--gold2);}

    /* ── FOCUS CARD ── */
    .focus-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:32px;display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;}
    .focus-icon{font-size:36px;flex-shrink:0;}
    .focus-body{flex:1;min-width:200px;}
    .focus-title{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:8px;}
    .focus-desc{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:14px;}
    .skill-tags{display:flex;gap:8px;flex-wrap:wrap;}
    .skill-tag{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;}
    .skill-weak{background:rgba(255,87,87,.12);border:1px solid rgba(255,87,87,.3);color:var(--red);}
    .skill-ok{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.25);color:var(--gold);}
    .skill-strong{background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.25);color:var(--teal);}
    .focus-lessons-btn{padding:9px 20px;background:var(--gold);color:#000;border:none;border-radius:8px;font-family:var(--ff);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;white-space:nowrap;}
    .focus-lessons-btn:hover{background:var(--gold2);}
    .focus-empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0;}

    /* ── EXAMS GRID ── */
    .exams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:40px;}
    .exam-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
    .exam-card:hover{transform:translateY(-2px);border-color:var(--gold);}
    .exam-card.locked{cursor:default;}
    .exam-card.locked:hover{transform:none;border-color:var(--border);}
    .exam-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:12px;}
    .exam-free-tag{background:rgba(0,201,167,.12);border:1px solid rgba(0,201,167,.3);color:var(--teal);}
    .exam-lock-tag{background:rgba(60,74,107,.3);border:1px solid var(--border);color:var(--muted);}
    .exam-name{font-family:var(--fd);font-size:16px;font-weight:700;margin-bottom:6px;}
    .exam-meta{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
    .exam-bar{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:14px;}
    .exam-bar-fill{height:100%;border-radius:3px;transition:width .3s;}
    .exam-footer{display:flex;align-items:center;justify-content:space-between;}
    .exam-qs{font-size:11px;color:var(--muted);}
    .exam-start-btn{padding:6px 16px;border:none;border-radius:8px;font-family:var(--ff);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
    .exam-start-active{background:var(--gold);color:#000;}
    .exam-start-active:hover{background:var(--gold2);}
    .exam-start-locked{background:var(--card2);color:var(--muted);cursor:not-allowed;}
    .exam-accent{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:3px 0 0 3px;}

    /* ── RESULTS ── */
    .results-list{display:flex;flex-direction:column;gap:12px;}
    .result-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
    .result-score-ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:16px;font-weight:800;flex-shrink:0;border:3px solid;}
    .result-body{flex:1;min-width:180px;}
    .result-title{font-size:14px;font-weight:700;margin-bottom:4px;}
    .result-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .result-skills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
    .result-skill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--border);}
    .result-stats{display:flex;gap:14px;flex-wrap:wrap;}
    .result-stat{font-size:11px;color:var(--muted);}
    .result-stat span{color:var(--text);font-weight:600;}
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
    .empty-icon{font-size:40px;margin-bottom:12px;}
    .empty-text{font-size:14px;}

    /* ── PAYWALL MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:400px;text-align:center;}
    .modal-icon{font-size:44px;margin-bottom:16px;}
    .modal-title{font-family:var(--fd);font-size:22px;font-weight:800;margin-bottom:8px;}
    .modal-sub{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:24px;}
    .modal-btn{display:block;width:100%;padding:14px;background:var(--gold);color:#000;border:none;border-radius:10px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;margin-bottom:10px;}
    .modal-btn:hover{background:var(--gold2);}
    .modal-close{background:transparent;border:none;color:var(--muted);font-family:var(--ff);font-size:13px;cursor:pointer;padding:6px;}
    .modal-close:hover{color:var(--text);}

    /* ── LOADER ── */
    .loader-overlay{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;align-items:center;justify-content:center;}
    .loader-overlay.out{display:none;}
    .spinner{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:600px){
      .nav{padding:12px 16px;}
      .page{padding:20px 16px 40px;}
      .status-banner{padding:12px 16px;}
      .focus-card{padding:16px;}
    }
  </style>
</head>

  // ── THEME ──────────────────────────────────────────────────────
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
  }
  function toggleTheme() {
    const next = (localStorage.getItem('sp_theme') || 'dark') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('sp_theme', next);
    applyTheme(next);
  }

  // ── SIGN OUT ───────────────────────────────────────────────────
  async function signOut() {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  }

  // ── STATUS BANNER ──────────────────────────────────────────────
  function renderBanner(prof) {
    const banner = document.getElementById('statusBanner');
    const icon   = document.getElementById('bannerIcon');
    const text   = document.getElementById('bannerText');
    const btn    = document.getElementById('bannerBtn');
    const status = prof.subscription_status || 'trial';
    const used   = prof.trial_tests_used || 0;

    banner.style.display = 'flex';

    if (status === 'active') {
      banner.style.display = 'none';
      return;
    }

    if (status === 'trial') {
      const remaining = 3 - used;
      banner.className = 'status-banner banner-trial';
      icon.textContent = '⏳';
      text.innerHTML = `<strong>${t.banner.trial(used)}</strong> — ${remaining} remaining`;
      if (remaining <= 0) {
        text.innerHTML = `<strong>${t.banner.trialDone}</strong>`;
        btn.textContent = t.bannerBtn.trialDone;
        btn.style.display = 'inline-block';
      } else {
        btn.textContent = t.bannerBtn.trial;
        btn.style.display = 'inline-block';
      }
    } else if (status === 'pending') {
      banner.className = 'status-banner banner-pending';
      icon.textContent = '🔄';
      text.innerHTML = `<strong>${t.banner.pending}</strong>`;
      btn.style.display = 'none';
    } else if (status === 'expired') {
      banner.className = 'status-banner banner-expired';
      icon.textContent = '❌';
      text.innerHTML = `<strong>${t.banner.expired}</strong>`;
      btn.textContent = t.bannerBtn.expired;
      btn.style.display = 'inline-block';
    }
  }

  // ── EXAMS ──────────────────────────────────────────────────────
  const EXAM_COLORS = {
    TCF:'#4169FF',TEF:'#9B6DFF',IELTS:'#F0A500',YDS:'#4169FF',
    'YÖKDİL':'#00C9A7','e-YDS':'#00C9A7',TOEFL:'#FF5757',TOEIC:'#F0A500',
    DELF:'#FF7F50',DALF:'#FF5733','Cambridge B2':'#2196F3','Cambridge C1':'#1565C0',
    CAPM:'#8B5CF6',PMP:'#7C3AED',PRINCE2:'#6D28D9','Scrum Master':'#059669',
    'Six Sigma':'#DC2626',CISSP:'#B45309','AWS Cloud':'#D97706','Google Cloud':'#0EA5E9',
    Custom:'#64748B',
  };

  function canStartExam(prof) {
    const status = prof.subscription_status || 'trial';
    if (status === 'active') return true;
    if (status === 'trial') return (prof.trial_tests_used || 0) < 3;
    return false;
  }

  function renderExams(exams, prof) {
    const grid = document.getElementById('examsGrid');
    if (!exams || !exams.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">${t.noExams}</div></div>`;
      return;
    }

    const canStart = canStartExam(prof);
    const status   = prof.subscription_status || 'trial';
    const used     = prof.trial_tests_used || 0;
    const trialMax = 3;

    // Find best score per exam type for progress bar
    const bestScores = {};
    attempts.forEach(a => {
      const key = a.exam_id;
      if (!bestScores[key] || a.score > bestScores[key]) bestScores[key] = a.score;
    });

    grid.innerHTML = exams.map(ex => {
      const color    = EXAM_COLORS[ex.type] || '#4169FF';
      const isFree   = ex.is_free;
      const locked   = !canStart && !isFree;
      const best     = bestScores[ex.id];
      const barW     = best ? best + '%' : '0%';
      const barColor = best >= 70 ? 'var(--teal)' : best >= 50 ? 'var(--gold)' : 'var(--red)';
      const tagLabel = isFree ? t.freeTag : (locked ? t.lockedTag : '');
      const tagClass = isFree ? 'exam-free-tag' : 'exam-lock-tag';

      return `
        <div class="exam-card${locked?' locked':''}" onclick="${locked ? 'openPaywall()' : `startExam('${ex.id}')`}">
          <div class="exam-accent" style="background:${color};"></div>
          ${tagLabel ? `<div class="exam-tag ${tagClass}">${tagLabel}</div>` : '<div style="height:22px;"></div>'}
          <div class="exam-name">${ex.title || ex.type}</div>
          <div class="exam-meta">${ex.type} · ${ex.duration_minutes || 60} min · ${ex.difficulty_level || 'All levels'}</div>
          ${best !== undefined ? `
            <div class="exam-bar"><div class="exam-bar-fill" style="width:${barW};background:${barColor};"></div></div>
          ` : '<div class="exam-bar"><div class="exam-bar-fill" style="width:0;background:var(--gold);"></div></div>'}
          <div class="exam-footer">
            <span class="exam-qs">${ex.question_count || '—'} ${t.questions}</span>
            <button class="exam-start-btn ${locked?'exam-start-locked':'exam-start-active'}" onclick="event.stopPropagation();${locked?'openPaywall()':``startExam('${ex.id}')``}">
              ${locked ? '🔒 ' + t.lockedBtn : t.startBtn + ' →'}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  function startExam(examId) {
    window.location.href = `exam.html?id=${examId}`;
  }

  // ── PAYWALL ────────────────────────────────────────────────────
  function openPaywall() {
    document.getElementById('paywallTitle').textContent = t.paywallTitle;
    document.getElementById('paywallSub').textContent   = t.paywallSub;
    document.getElementById('paywallBtn').textContent   = t.paywallBtn;
    document.getElementById('paywallClose').textContent = t.paywallClose;
    document.getElementById('paywallModal').classList.add('open');
  }
  function closePaywall() {
    document.getElementById('paywallModal').classList.remove('open');
  }

  // ── RESULTS ───────────────────────────────────────────────────
  function renderResults(attempts) {
    const list = document.getElementById('resultsList');
    if (!attempts || !attempts.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">${t.noResults}</div></div>`;
      return;
    }

    list.innerHTML = attempts.map(a => {
      const score    = a.score || 0;
      const color    = score >= 70 ? 'var(--teal)' : score >= 50 ? 'var(--gold)' : 'var(--red)';
      const date     = new Date(a.completed_at).toLocaleDateString();
      const mins     = a.duration_seconds ? Math.round(a.duration_seconds / 60) + ' min' : '—';
      const skills   = a.skill_scores ? Object.entries(a.skill_scores) : [];

      return `
        <div class="result-card">
          <div class="result-score-ring" style="color:${color};border-color:${color};background:${color}15;">
            ${score}%
          </div>
          <div class="result-body">
            <div class="result-title">${a.exam_title || a.exam_type || 'Exam'}</div>
            <div class="result-meta">${date}</div>
            ${skills.length ? `
              <div class="result-skills">
                ${skills.map(([skill, sc]) => {
                  const c = sc >= 70 ? 'var(--teal)' : sc >= 50 ? 'var(--gold)' : 'var(--red)';
                  const label = t.skills[skill] || skill;
                  return `<span class="result-skill" style="color:${c};border-color:${c}30;">${label}: ${sc}%</span>`;
                }).join('')}
              </div>` : ''}
            <div class="result-stats">
              <div class="result-stat">${t.correct}: <span>${a.correct_answers || 0}/${a.total_questions || 0}</span></div>
              <div class="result-stat">${t.time}: <span>${mins}</span></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── FOCUS / RECOMMENDATIONS ────────────────────────────────────
  function renderFocus(attempts) {
    if (!attempts || !attempts.length) return;

    const latest = attempts[0];
    const skills = latest.skill_scores ? Object.entries(latest.skill_scores) : [];

    if (!skills.length) return;

    const weak   = skills.filter(([,s]) => s < 60).sort((a,b) => a[1]-b[1]);
    const ok     = skills.filter(([,s]) => s >= 60 && s < 80);
    const strong = skills.filter(([,s]) => s >= 80);

    document.getElementById('focusEmpty').style.display   = 'none';
    document.getElementById('focusContent').style.display = 'block';
    document.getElementById('focusLessonsBtn').style.display = 'inline-block';
    document.getElementById('focusHeadline').textContent  = t.focusHeadline;
    document.getElementById('focusDesc').textContent      = t.focusDesc;

    const tags = document.getElementById('skillTags');
    tags.innerHTML = [
      ...weak.map(([s]) => `<span class="skill-tag skill-weak">⚠️ ${t.skills[s]||s}</span>`),
      ...ok.map(([s])   => `<span class="skill-tag skill-ok">📈 ${t.skills[s]||s}</span>`),
      ...strong.map(([s])=> `<span class="skill-tag skill-strong">✅ ${t.skills[s]||s}</span>`),
    ].join('');
  }

  // ── APPLY LANG ─────────────────────────────────────────────────
  function applyLang() {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', t.dir);
    const s = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
    s('focusTitle',   t.focusTitle);
    s('lessonsLink',  t.lessonsLink);
    s('examsTitle',   t.examsTitle);
    s('resultsTitle', t.resultsTitle);
    s('focusEmpty',   t.focusEmpty);
    s('signOutBtn',   t.signOut);
  }

  // ── INIT ───────────────────────────────────────────────────────
  async function init() {
    applyTheme(localStorage.getItem('sp_theme') || 'dark');
    market = localStorage.getItem('sp_market') || 'dz';
    lang   = localStorage.getItem('sp_lang')   || 'en';
    t      = T[lang] || T.en;
    applyLang();

    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      // Load profile
      const { data: prof } = await sb.from('profiles')
        .select('*').eq('id', session.user.id).maybeSingle();
      profile = prof;

      // Admin redirect
      if (prof?.role === 'admin') { window.location.href = 'admin-landing.html'; return; }

      // Nav name
      document.getElementById('navName').textContent = prof?.full_name || '';

      // Logo
      try {
        const { data: cfg } = await sb.from('landing_config')
          .select('logo_url').eq('market', market).maybeSingle();
        if (cfg?.logo_url) {
          const img = new Image();
          img.onload = () => { document.getElementById('logoMark').innerHTML = `<img src="${cfg.logo_url}" style="width:100%;height:100%;object-fit:contain;">`; };
          img.src = cfg.logo_url;
        }
      } catch(e) {}

      // Status banner
      renderBanner(prof);

      // Load exams
      const { data: exams } = await sb.from('exams')
        .select('id, title, type, duration_minutes, difficulty_level, is_free, is_active, question_count')
        .eq('is_active', true)
        .eq('market', market)
        .order('is_free', { ascending: false });

      // Load exam attempts
      const { data: atts } = await sb.from('exam_attempts')
        .select('*')
        .eq('student_id', session.user.id)
        .order('completed_at', { ascending: false })
        .limit(20);
      attempts = atts || [];

      renderExams(exams || [], prof);
      renderResults(attempts);
      renderFocus(attempts);

    } catch(err) {
      console.error('Dashboard error:', err);
    } finally {
      document.getElementById('loaderOverlay').classList.add('out');
    }
  }

  init();
</script>
</body>
</html>
