<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaglish — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#080B18; --card:#0E1120; --card2:#131626;
      --border:#1C2240; --gold:#F0A500; --gold2:#FFD166;
      --teal:#00C9A7; --red:#FF5757; --blue:#4169FF; --purple:#9B6DFF;
      --text:#EEF2FF; --sub:#8896B8; --muted:#3D4A6A;
      --ff:'Barlow',sans-serif; --fd:'Syne',sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--ff);min-height:100vh;}
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 60% 40% at 10% 10%,rgba(65,105,255,.07),transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 90%,rgba(240,165,0,.05),transparent 70%);
    }

    /* ── NAV ─────────────────────────────────── */
    nav{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 28px;
      background:rgba(8,11,24,.9);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;
    }
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .logo-mark{
      width:32px;height:32px;
      background:linear-gradient(135deg,var(--gold),#E8961A);
      border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-weight:800;font-size:13px;color:#000;
      overflow:hidden;flex-shrink:0;
    }
    .logo-text{font-family:var(--fd);font-size:18px;font-weight:700;}
    .logo-text span{color:var(--gold);}
    .nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

    .lang-toggle{
      display:flex;gap:3px;background:var(--card2);
      border:1px solid var(--border);border-radius:8px;padding:3px;
    }
    .lang-btn{
      background:transparent;border:none;color:var(--sub);
      padding:4px 10px;border-radius:6px;cursor:pointer;
      font-family:var(--ff);font-size:11px;font-weight:600;transition:all .2s;
    }
    .lang-btn.active{background:var(--border);color:var(--text);}

    .sub-badge{
      font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;
    }
    .sub-trial{background:rgba(240,165,0,.15);color:var(--gold);border:1px solid rgba(240,165,0,.3);}
    .sub-active{background:rgba(0,201,167,.15);color:var(--teal);border:1px solid rgba(0,201,167,.3);}
    .sub-expired{background:rgba(255,87,87,.15);color:var(--red);border:1px solid rgba(255,87,87,.3);}
    .sub-pending{background:rgba(155,109,255,.15);color:var(--purple);border:1px solid rgba(155,109,255,.3);}

    .avatar{
      width:34px;height:34px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold),var(--blue));
      display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-weight:700;font-size:13px;color:#000;
      cursor:pointer;flex-shrink:0;position:relative;
    }

    .dropdown{
      position:absolute;top:44px;right:0;
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:6px;min-width:160px;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      display:none;z-index:100;
    }
    .dropdown.open{display:block;}
    .dropdown-item{
      display:flex;align-items:center;gap:10px;
      padding:9px 12px;border-radius:8px;cursor:pointer;
      font-size:13px;color:var(--sub);transition:all .15s;
    }
    .dropdown-item:hover{background:var(--card2);color:var(--text);}
    .dropdown-divider{height:1px;background:var(--border);margin:4px 0;}

    /* ── CONTENT ─────────────────────────────── */
    .page{max-width:1040px;margin:0 auto;padding:32px 20px;position:relative;z-index:1;}

    /* ── WELCOME ─────────────────────────────── */
    .welcome{margin-bottom:28px;}
    .welcome h1{font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:4px;}
    .welcome p{font-size:14px;color:var(--sub);font-weight:300;}

    /* ── UPGRADE BANNER ──────────────────────── */
    .upgrade-banner{
      background:linear-gradient(135deg,rgba(240,165,0,.12),rgba(65,105,255,.08));
      border:1px solid rgba(240,165,0,.25);border-radius:14px;
      padding:20px 24px;margin-bottom:24px;
      display:flex;align-items:center;justify-content:space-between;
      gap:16px;flex-wrap:wrap;
    }
    .upgrade-banner-left h3{font-family:var(--fd);font-size:16px;font-weight:700;margin-bottom:4px;}
    .upgrade-banner-left p{font-size:13px;color:var(--sub);}
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:9px 22px;border-radius:10px;
      font-family:var(--ff);font-size:13px;font-weight:600;
      cursor:pointer;transition:all .2s;border:none;text-decoration:none;
    }
    .btn-primary{background:var(--gold);color:#000;}
    .btn-primary:hover{background:var(--gold2);transform:translateY(-1px);}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub);}
    .btn-ghost:hover{border-color:var(--sub);color:var(--text);}

    /* ── STATS ROW ───────────────────────────── */
    .stats-row{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:12px;margin-bottom:28px;
    }
    .stat-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:16px;
    }
    .stat-card-label{font-size:12px;color:var(--muted);margin-bottom:6px;}
    .stat-card-value{font-family:var(--fd);font-size:22px;font-weight:700;}

    /* ── SECTION TITLE ───────────────────────── */
    .section-header{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:16px;
    }
    .section-title{font-family:var(--fd);font-size:17px;font-weight:700;}
    .section-sub{font-size:12px;color:var(--muted);}

    /* ── EXAM GRID ───────────────────────────── */
    .exam-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
      gap:12px;margin-bottom:32px;
    }
    .exam-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:18px;
      transition:all .25s;position:relative;overflow:hidden;
    }
    .exam-card.unlocked{cursor:pointer;}
    .exam-card.unlocked:hover{transform:translateY(-2px);border-color:var(--card-color,var(--gold));}
    .exam-card.locked{opacity:.6;}
    .exam-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:var(--card-color,var(--gold));
      transform:scaleX(0);transition:transform .25s;
    }
    .exam-card.unlocked:hover::before{transform:scaleX(1);}

    .exam-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .exam-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
    .exam-free{
      background:rgba(0,201,167,.15);color:var(--teal);
      font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;
      border:1px solid rgba(0,201,167,.3);
    }
    .exam-title{font-size:14px;font-weight:600;margin-bottom:5px;line-height:1.3;}
    .exam-meta{font-size:12px;color:var(--muted);}

    .exam-action{
      margin-top:14px;width:100%;padding:8px;border:none;
      border-radius:8px;font-family:var(--ff);font-size:12px;
      font-weight:600;cursor:pointer;transition:all .2s;
    }
    .exam-action-start{background:var(--gold);color:#000;}
    .exam-action-start:hover{background:var(--gold2);}
    .exam-action-locked{
      background:var(--card2);color:var(--muted);cursor:not-allowed;
      border:1px solid var(--border);
    }

    /* ── RECENT ATTEMPTS ─────────────────────── */
    .attempts-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}

    .attempt-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:10px;padding:14px 18px;
      display:flex;align-items:center;gap:14px;
      cursor:pointer;transition:border-color .2s;
    }
    .attempt-card:hover{border-color:var(--sub);}

    .attempt-score{
      width:48px;height:48px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-size:14px;font-weight:700;
    }

    .attempt-info{flex:1;}
    .attempt-title{font-size:14px;font-weight:600;margin-bottom:2px;}
    .attempt-meta{font-size:12px;color:var(--muted);}

    .attempt-level{
      font-size:12px;font-weight:700;padding:3px 10px;
      border-radius:20px;flex-shrink:0;
    }

    /* ── EMPTY STATE ─────────────────────────── */
    .empty-state{
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:40px;text-align:center;
    }
    .empty-icon{font-size:40px;margin-bottom:14px;}
    .empty-title{font-family:var(--fd);font-size:16px;font-weight:700;margin-bottom:6px;}
    .empty-sub{font-size:13px;color:var(--sub);}

    /* ── LOADER ──────────────────────────────── */
    .loader-overlay{
      position:fixed;inset:0;background:var(--bg);z-index:400;
      display:flex;align-items:center;justify-content:center;
    }
    .loader-overlay.out{display:none;}
    .spinner{
      width:36px;height:36px;border:2px solid var(--border);
      border-top-color:var(--gold);border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:640px){
      nav{padding:12px 16px;}
      .page{padding:20px 14px;}
      .lang-toggle{display:none;}
    }
  </style>
</head>
<body>

<div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

<!-- Nav -->
<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-mark" id="logoMark">Sp</div>
    <span class="logo-text">Speak<span>glish</span></span>
  </a>
  <div class="nav-right">
    <div class="lang-toggle">
      <button class="lang-btn" id="btnAr" onclick="setLang('ar')">AR</button>
      <button class="lang-btn" id="btnFr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btnTr" onclick="setLang('tr')">TR</button>
    </div>
    <div class="sub-badge" id="subBadge">Trial</div>
    <div class="avatar" id="avatar" onclick="toggleDropdown()">
      <span id="avatarLetter">?</span>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-item" onclick="window.location.href='payment.html'">💳 <span id="ddUpgrade">Upgrade</span></div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="signOut()">🚪 <span id="ddSignOut">Sign out</span></div>
      </div>
    </div>
  </div>
</nav>

<!-- Page -->
<div class="page">

  <!-- Welcome -->
  <div class="welcome">
    <h1 id="welcomeTitle">Hello 👋</h1>
    <p id="welcomeSub">Continue your exam preparation</p>
  </div>

  <!-- Upgrade Banner (shown for trial/expired) -->
  <div class="upgrade-banner" id="upgradeBanner" style="display:none;">
    <div class="upgrade-banner-left">
      <h3 id="bannerTitle">🎯 Unlock Full Access</h3>
      <p id="bannerSub">You have used <strong id="trialUsed">0</strong> of 3 free exams. Upgrade for unlimited access.</p>
    </div>
    <a href="payment.html" class="btn btn-primary" id="bannerBtn">Upgrade Now →</a>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-card-label" id="statLabelExams">Exams taken</div>
      <div class="stat-card-value" id="statExams" style="color:var(--blue);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label" id="statLabelAvg">Average score</div>
      <div class="stat-card-value" id="statAvg" style="color:var(--gold);">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label" id="statLabelBest">Best score</div>
      <div class="stat-card-value" id="statBest" style="color:var(--teal);">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label" id="statLabelSub">Subscription</div>
      <div class="stat-card-value" id="statSub" style="font-size:14px;color:var(--sub);">Trial</div>
    </div>
  </div>

  <!-- Available Exams -->
  <div class="section-header">
    <div class="section-title" id="examsTitle">Available Exams</div>
    <div class="section-sub" id="examsSub">1 free exam included</div>
  </div>
  <div class="exam-grid" id="examGrid"></div>

  <!-- Recent Attempts -->
  <div class="section-header">
    <div class="section-title" id="attemptsTitle">Recent Results</div>
  </div>
  <div id="attemptsList"></div>

</div>

<script>
  const sb = supabase.createClient(
    'https://iugggbzgrucopvxkgzry.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1Z2dnYnpncnVjb3B2eGtnenJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTMyMDAsImV4cCI6MjA5NTgyOTIwMH0.Z1wosmmuipQS-KjWnKJRhOoXXgYzvEMy13Uah011Vw0'
  );

  // ─── EXAM DATA ────────────────────────────────────────────────
  const EXAMS = {
    dz:[
      {id:'tcf-reading', title:'TCF — Compréhension Écrite', type:'TCF', skill:'Lecture', dur:60, count:45, color:'#4169FF', free:true},
      {id:'tcf-listening', title:'TCF — Compréhension Orale', type:'TCF', skill:'Écoute', dur:40, count:39, color:'#00C9A7', free:false},
      {id:'tef-reading', title:'TEF — Compréhension Écrite', type:'TEF', skill:'Lecture', dur:60, count:50, color:'#9B6DFF', free:false},
      {id:'ielts-reading', title:'IELTS Academic — Reading', type:'IELTS', skill:'Reading', dur:60, count:40, color:'#F0A500', free:false},
      {id:'delf-reading', title:'DELF B2 — Compréhension', type:'DELF', skill:'Lecture', dur:60, count:35, color:'#FF5757', free:false},
    ],
    tr:[
      {id:'yds-main', title:'YDS — Yabancı Dil Sınavı', type:'YDS', skill:'İngilizce', dur:180, count:80, color:'#4169FF', free:true},
      {id:'yokdil-main', title:'YÖKDİL — Academic English', type:'YÖKDİL', skill:'İngilizce', dur:180, count:80, color:'#00C9A7', free:false},
      {id:'eyds-main', title:'e-YDS — Online Format', type:'e-YDS', skill:'İngilizce', dur:180, count:80, color:'#9B6DFF', free:false},
      {id:'ielts-reading-tr', title:'IELTS Academic — Reading', type:'IELTS', skill:'Reading', dur:60, count:40, color:'#F0A500', free:false},
      {id:'toefl-reading', title:'TOEFL iBT — Reading', type:'TOEFL', skill:'Reading', dur:54, count:30, color:'#FF5757', free:false},
    ]
  };

  // ─── TRANSLATIONS ─────────────────────────────────────────────
  const T = {
    ar:{
      welcomeTitle:'مرحباً', welcomeSub:'واصل التحضير لامتحانك',
      bannerTitle:'🎯 افتح الوصول الكامل',
      examsTitle:'الامتحانات المتاحة', examsSub:'اختبار مجاني واحد مشمول',
      attemptsTitle:'النتائج الأخيرة',
      statLabelExams:'الامتحانات المجراة', statLabelAvg:'المعدل',
      statLabelBest:'أفضل نتيجة', statLabelSub:'الاشتراك',
      startBtn:'ابدأ', lockedBtn:'🔒 مقفل',
      ddUpgrade:'ترقية الحساب', ddSignOut:'تسجيل الخروج',
      noAttempts:'لم تجرِ أي امتحانات بعد',
      noAttemptsSub:'اختر امتحاناً أعلاه وابدأ الآن',
      subTrial:'تجربة مجانية', subActive:'نشط', subExpired:'منتهي الصلاحية', subPending:'في الانتظار',
      dir:'rtl'
    },
    fr:{
      welcomeTitle:'Bonjour', welcomeSub:'Continuez votre préparation',
      bannerTitle:'🎯 Débloquer l\'accès complet',
      examsTitle:'Examens disponibles', examsSub:'1 test gratuit inclus',
      attemptsTitle:'Résultats récents',
      statLabelExams:'Examens passés', statLabelAvg:'Score moyen',
      statLabelBest:'Meilleur score', statLabelSub:'Abonnement',
      startBtn:'Commencer', lockedBtn:'🔒 Verrouillé',
      ddUpgrade:'Passer au premium', ddSignOut:'Se déconnecter',
      noAttempts:'Aucun examen passé pour l\'instant',
      noAttemptsSub:'Choisissez un examen ci-dessus et commencez',
      subTrial:'Essai gratuit', subActive:'Actif', subExpired:'Expiré', subPending:'En attente',
      dir:'ltr'
    },
    en:{
      welcomeTitle:'Hello', welcomeSub:'Continue your exam preparation',
      bannerTitle:'🎯 Unlock Full Access',
      examsTitle:'Available Exams', examsSub:'1 free exam included',
      attemptsTitle:'Recent Results',
      statLabelExams:'Exams taken', statLabelAvg:'Average score',
      statLabelBest:'Best score', statLabelSub:'Subscription',
      startBtn:'Start', lockedBtn:'🔒 Locked',
      ddUpgrade:'Upgrade Plan', ddSignOut:'Sign out',
      noAttempts:'No exams taken yet',
      noAttemptsSub:'Pick an exam above and start now',
      subTrial:'Free Trial', subActive:'Active', subExpired:'Expired', subPending:'Pending',
      dir:'ltr'
    },
    tr:{
      welcomeTitle:'Merhaba', welcomeSub:'Sınav hazırlığına devam et',
      bannerTitle:'🎯 Tam Erişimi Aç',
      examsTitle:'Mevcut Sınavlar', examsSub:'1 ücretsiz test dahil',
      attemptsTitle:'Son Sonuçlar',
      statLabelExams:'Girilen sınav', statLabelAvg:'Ortalama puan',
      statLabelBest:'En iyi puan', statLabelSub:'Abonelik',
      startBtn:'Başla', lockedBtn:'🔒 Kilitli',
      ddUpgrade:'Planı Yükselt', ddSignOut:'Çıkış yap',
      noAttempts:'Henüz sınava girilmedi',
      noAttemptsSub:'Yukarıdan bir sınav seç ve başla',
      subTrial:'Ücretsiz Deneme', subActive:'Aktif', subExpired:'Süresi Doldu', subPending:'Beklemede',
      dir:'ltr'
    }
  };

  // ─── STATE ────────────────────────────────────────────────────
  let lang    = localStorage.getItem('sp_lang') || 'en';
  let market  = localStorage.getItem('sp_market') || 'dz';
  let profile = null;
  let t       = T[lang];

  // ─── LANG ─────────────────────────────────────────────────────
  function setLang(l) {
    lang = l; t = T[l];
    localStorage.setItem('sp_lang', l);
    applyLang();
    renderExams();
    if (profile) renderAttempts();
  }

  function applyLang() {
    document.documentElement.setAttribute('dir', t.dir);
    document.documentElement.setAttribute('lang', lang);
    setText('examsTitle', t.examsTitle);
    setText('examsSub', t.examsSub);
    setText('attemptsTitle', t.attemptsTitle);
    setText('statLabelExams', t.statLabelExams);
    setText('statLabelAvg', t.statLabelAvg);
    setText('statLabelBest', t.statLabelBest);
    setText('statLabelSub', t.statLabelSub);
    setText('bannerTitle', t.bannerTitle);
    setText('ddUpgrade', t.ddUpgrade);
    setText('ddSignOut', t.ddSignOut);
    ['ar','fr','en','tr'].forEach(c => {
      const b = document.getElementById('btn'+c.charAt(0).toUpperCase()+c.slice(1));
      if(b) b.classList.toggle('active', c === lang);
    });
    document.title = `Speaglish — ${t.examsTitle}`;
  }

  // ─── RENDER EXAMS ─────────────────────────────────────────────
  function renderExams() {
    const exams   = EXAMS[market] || EXAMS.dz;
    const isActive = profile?.subscription_status === 'active';
    const trialUsed = profile?.trial_tests_used || 0;

    document.getElementById('examGrid').innerHTML = exams.map(e => {
      const canAccess = isActive || (e.free && trialUsed < 3);
      return `
        <div class="exam-card ${canAccess ? 'unlocked' : 'locked'}"
          style="--card-color:${e.color};"
          ${canAccess ? `onclick="startExam('${e.id}','${e.title}')"` : ''}>
          <div class="exam-card-top">
            <span class="exam-tag"
              style="background:${e.color}20;color:${e.color};border:1px solid ${e.color}30;">
              ${e.type}
            </span>
            ${e.free ? `<span class="exam-free">FREE</span>` : ''}
            ${!canAccess ? `<span style="color:var(--muted);font-size:14px;">🔒</span>` : ''}
          </div>
          <div class="exam-title">${e.title}</div>
          <div class="exam-meta">${e.skill} · ${e.dur} min · ${e.count} Q</div>
          <button class="exam-action ${canAccess ? 'exam-action-start' : 'exam-action-locked'}"
            ${!canAccess ? 'disabled' : `onclick="event.stopPropagation();startExam('${e.id}','${e.title}')"`}>
            ${canAccess ? t.startBtn + ' →' : t.lockedBtn}
          </button>
        </div>
      `;
    }).join('');
  }

  function startExam(id, title) {
    localStorage.setItem('sp_current_exam', JSON.stringify({ id, title, market }));
    window.location.href = 'exam.html';
  }

  // ─── RENDER ATTEMPTS ──────────────────────────────────────────
  function renderAttempts(attempts = []) {
    const el = document.getElementById('attemptsList');
    if (!attempts.length) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <div class="empty-title">${t.noAttempts}</div>
          <div class="empty-sub">${t.noAttemptsSub}</div>
        </div>`;
      return;
    }
    el.innerHTML = attempts.map(a => {
      const pct   = a.score || 0;
      const color = pct >= 70 ? 'var(--teal)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
      const lvl   = pct >= 80 ? 'C1' : pct >= 65 ? 'B2' : pct >= 50 ? 'B1' : 'A2';
      const date  = new Date(a.completed_at).toLocaleDateString();
      return `
        <div class="attempt-card" onclick="viewResult('${a.id}')">
          <div class="attempt-score" style="background:${color}20;color:${color};border:1px solid ${color}40;">
            ${pct}%
          </div>
          <div class="attempt-info">
            <div class="attempt-title">${a.exam_title || a.exam_type}</div>
            <div class="attempt-meta">${date} · ${a.correct_answers||0}/${a.total_questions||0} correct</div>
          </div>
          <span class="attempt-level" style="background:${color}20;color:${color};">${lvl}</span>
        </div>
      `;
    }).join('');
  }

  function viewResult(id) {
    localStorage.setItem('sp_result_id', id);
    window.location.href = 'results.html';
  }

  // ─── LOAD PROFILE & DATA ──────────────────────────────────────
  async function loadData(userId) {
    // Profile
    const { data: p } = await sb.from('profiles')
      .select('*').eq('id', userId).single();
    profile = p || {};
    market  = profile.market || localStorage.getItem('sp_market') || 'dz';
    localStorage.setItem('sp_market', market);

    // Welcome
    const name = profile.full_name?.split(' ')[0] || '';
    document.getElementById('welcomeTitle').textContent = `${t.welcomeTitle}${name ? ', ' + name : ''} 👋`;
    document.getElementById('welcomeSub').textContent   = t.welcomeSub;

    // Avatar
    document.getElementById('avatarLetter').textContent =
      (profile.full_name || '?').charAt(0).toUpperCase();

    // Subscription badge
    const status  = profile.subscription_status || 'trial';
    const subEl   = document.getElementById('subBadge');
    const subMap  = {
      trial:   ['sub-trial',   t.subTrial],
      active:  ['sub-active',  t.subActive],
      expired: ['sub-expired', t.subExpired],
      pending: ['sub-pending', t.subPending],
    };
    const [cls, label] = subMap[status] || subMap.trial;
    subEl.className = `sub-badge ${cls}`;
    subEl.textContent = label;
    document.getElementById('statSub').textContent = label;

    // Upgrade banner
    const trialUsed = profile.trial_tests_used || 0;
    if (status === 'trial' || status === 'expired') {
      const banner = document.getElementById('upgradeBanner');
      banner.style.display = 'flex';
      document.getElementById('trialUsed').textContent = trialUsed;
      document.getElementById('bannerTitle').textContent = t.bannerTitle;
      document.getElementById('bannerSub').innerHTML =
        status === 'expired'
          ? `Your subscription has expired. Renew to continue.`
          : `You have used <strong>${trialUsed}</strong> of 3 free exams. Upgrade for unlimited access.`;
      document.getElementById('bannerBtn').textContent = 'Upgrade Now →';
    }

    // Attempts
    const { data: attempts } = await sb
      .from('exam_attempts')
      .select('*')
      .eq('student_id', userId)
      .order('completed_at', { ascending: false })
      .limit(5);

    const all = attempts || [];

    // Stats
    document.getElementById('statExams').textContent = all.length;
    if (all.length) {
      const avg  = Math.round(all.reduce((s, a) => s + (a.score||0), 0) / all.length);
      const best = Math.max(...all.map(a => a.score || 0));
      document.getElementById('statAvg').textContent  = avg + '%';
      document.getElementById('statBest').textContent = best + '%';
    }

    renderExams();
    renderAttempts(all);

    // Logo
    try {
      const { data: cfg } = await sb.from('landing_config')
        .select('logo_url').eq('market', market).single();
      if (cfg?.logo_url) {
        document.getElementById('logoMark').innerHTML =
          `<img src="${cfg.logo_url}" style="width:100%;height:100%;object-fit:contain;">`;
      }
    } catch(e) {}
  }

  // ─── DROPDOWN ─────────────────────────────────────────────────
  function toggleDropdown() {
    document.getElementById('dropdown').classList.toggle('open');
  }
  document.addEventListener('click', e => {
    if (!document.getElementById('avatar').contains(e.target)) {
      document.getElementById('dropdown').classList.remove('open');
    }
  });

  // ─── SIGN OUT ─────────────────────────────────────────────────
  async function signOut() {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  }

  // ─── HELPERS ──────────────────────────────────────────────────
  const setText = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };

  // ─── INIT ─────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    // Redirect admin to admin panel
    const { data: p } = await sb.from('profiles')
      .select('role').eq('id', session.user.id).single();
    if (p?.role === 'admin') {
      window.location.href = 'admin-landing.html'; return;
    }

    applyLang();
    await loadData(session.user.id);
    document.getElementById('loaderOverlay').classList.add('out');
  }

  init();
</script>
</body>
</html>
