<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaglish — Upgrade Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#080B18;--card:#0E1120;--card2:#131626;
      --border:#1C2240;--gold:#F0A500;--gold2:#FFD166;
      --teal:#00C9A7;--red:#FF5757;--blue:#4169FF;--purple:#9B6DFF;
      --text:#EEF2FF;--sub:#8896B8;--muted:#3D4A6A;
      --ff:'Barlow',sans-serif;--fd:'Syne',sans-serif;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--ff);min-height:100vh;}
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse 50% 40% at 20% 20%,rgba(240,165,0,.06),transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%,rgba(65,105,255,.06),transparent 70%);
    }

    /* ── NAV ─────────────────────────────────── */
    nav{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 28px;background:rgba(8,11,24,.9);
      backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
      gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50;
    }
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .logo-mark{
      width:32px;height:32px;background:linear-gradient(135deg,var(--gold),#E8961A);
      border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-weight:800;font-size:13px;color:#000;
      overflow:hidden;flex-shrink:0;
    }
    .logo-text{font-family:var(--fd);font-size:18px;font-weight:700;}
    .logo-text span{color:var(--gold);}

    .btn{
      display:inline-flex;align-items:center;gap:6px;padding:9px 20px;
      border-radius:10px;font-family:var(--ff);font-size:13px;font-weight:600;
      cursor:pointer;transition:all .2s;border:none;text-decoration:none;
    }
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub);}
    .btn-ghost:hover{border-color:var(--sub);color:var(--text);}
    .btn-primary{background:var(--gold);color:#000;}
    .btn-primary:hover{background:var(--gold2);}
    .btn-full{width:100%;justify-content:center;}
    .btn-lg{padding:13px 28px;font-size:15px;}

    /* ── PAGE ────────────────────────────────── */
    .page{max-width:720px;margin:0 auto;padding:36px 20px;position:relative;z-index:1;}

    /* ── CURRENT STATUS ──────────────────────── */
    .status-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:14px;padding:20px 24px;margin-bottom:28px;
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    }
    .status-icon{font-size:28px;flex-shrink:0;}
    .status-info{flex:1;}
    .status-title{font-family:var(--fd);font-size:16px;font-weight:700;margin-bottom:3px;}
    .status-sub{font-size:13px;color:var(--sub);}
    .status-badge{
      font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;flex-shrink:0;
    }
    .badge-trial{background:rgba(240,165,0,.15);color:var(--gold);border:1px solid rgba(240,165,0,.3);}
    .badge-active{background:rgba(0,201,167,.15);color:var(--teal);border:1px solid rgba(0,201,167,.3);}
    .badge-expired{background:rgba(255,87,87,.15);color:var(--red);border:1px solid rgba(255,87,87,.3);}
    .badge-pending{background:rgba(155,109,255,.15);color:var(--purple);border:1px solid rgba(155,109,255,.3);}

    /* ── PENDING NOTICE ──────────────────────── */
    .pending-notice{
      background:rgba(155,109,255,.08);border:1px solid rgba(155,109,255,.25);
      border-radius:12px;padding:20px 24px;margin-bottom:28px;text-align:center;
    }
    .pending-icon{font-size:36px;margin-bottom:12px;}
    .pending-title{font-family:var(--fd);font-size:18px;font-weight:700;margin-bottom:6px;}
    .pending-sub{font-size:13px;color:var(--sub);line-height:1.6;}

    /* ── SECTION TITLE ───────────────────────── */
    .section-title{
      font-family:var(--fd);font-size:20px;font-weight:700;
      margin-bottom:6px;text-align:center;
    }
    .section-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:28px;}

    /* ── PRICING CARDS ───────────────────────── */
    .pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}

    .price-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:24px 20px;text-align:center;
      cursor:pointer;transition:all .25s;position:relative;
    }
    .price-card:hover{border-color:var(--gold);transform:translateY(-2px);}
    .price-card.selected{border-color:var(--gold);background:rgba(240,165,0,.05);}
    .price-card.featured{background:var(--gold);border-color:var(--gold);}
    .price-card.featured *{color:#000 !important;}
    .price-card.featured .popular-tag{background:rgba(0,0,0,.15);}

    .popular-tag{
      position:absolute;top:-11px;left:50%;transform:translateX(-50%);
      background:#111;color:var(--gold);font-size:10px;font-weight:800;
      letter-spacing:1px;text-transform:uppercase;padding:4px 14px;
      border-radius:20px;white-space:nowrap;border:1px solid var(--border);
    }

    .plan-duration{font-size:13px;color:var(--sub);margin-bottom:8px;}
    .plan-price{font-family:var(--fd);font-size:34px;font-weight:800;line-height:1;margin-bottom:4px;}
    .plan-currency{font-size:12px;color:var(--sub);margin-bottom:18px;}
    .plan-features{list-style:none;text-align:left;margin-bottom:20px;}
    .plan-features li{
      font-size:12px;color:var(--sub);padding:4px 0;
      display:flex;align-items:center;gap:7px;
    }
    .plan-features li::before{content:'✓';color:var(--teal);font-weight:700;flex-shrink:0;}
    .price-card.featured .plan-features li::before{color:#000;}

    .select-btn{
      width:100%;padding:10px;border:none;border-radius:8px;
      font-family:var(--ff);font-size:13px;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .select-btn-default{background:var(--gold);color:#000;}
    .select-btn-default:hover{background:var(--gold2);}
    .select-btn-featured{background:rgba(0,0,0,.15);color:#000;border:1px solid rgba(0,0,0,.2);}
    .select-btn-selected{background:var(--teal);color:#000;}

    /* ── PAYMENT SECTION ─────────────────────── */
    .payment-section{
      background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:28px;margin-bottom:16px;
    }
    .payment-title{
      font-family:var(--fd);font-size:18px;font-weight:700;
      margin-bottom:20px;display:flex;align-items:center;gap:10px;
    }

    .selected-plan-summary{
      background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);
      border-radius:10px;padding:14px 18px;margin-bottom:22px;
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    }
    .summary-plan{font-size:14px;font-weight:600;}
    .summary-amount{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--gold);}

    /* Steps */
    .steps{display:flex;flex-direction:column;gap:0;margin-bottom:22px;}
    .step{
      display:flex;gap:14px;padding:14px 0;
      border-bottom:1px solid var(--border);
    }
    .step:last-child{border-bottom:none;}
    .step-num{
      width:28px;height:28px;border-radius:50%;
      background:rgba(240,165,0,.15);border:1px solid rgba(240,165,0,.3);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-size:13px;font-weight:700;color:var(--gold);
      flex-shrink:0;margin-top:1px;
    }
    .step-content{flex:1;}
    .step-title{font-size:14px;font-weight:600;margin-bottom:4px;}
    .step-desc{font-size:12px;color:var(--sub);line-height:1.6;}
    .step-highlight{
      background:var(--bg);border:1px solid var(--border);
      border-radius:8px;padding:10px 14px;margin-top:8px;
      font-family:monospace;font-size:14px;color:var(--text);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .copy-btn{
      background:var(--card2);border:1px solid var(--border);
      color:var(--sub);padding:4px 10px;border-radius:6px;
      cursor:pointer;font-size:11px;font-family:var(--ff);font-weight:600;
      transition:all .2s;flex-shrink:0;
    }
    .copy-btn:hover{border-color:var(--gold);color:var(--gold);}

    /* Upload */
    .upload-area{
      border:2px dashed var(--border);border-radius:10px;
      padding:24px;text-align:center;cursor:pointer;
      transition:all .2s;position:relative;overflow:hidden;
      margin-top:8px;
    }
    .upload-area:hover{border-color:var(--gold);background:rgba(240,165,0,.03);}
    .upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .upload-icon{font-size:28px;margin-bottom:8px;}
    .upload-text{font-size:13px;color:var(--sub);}
    .upload-hint{font-size:11px;color:var(--muted);margin-top:4px;}

    .upload-preview{
      display:none;align-items:center;gap:12px;
      background:rgba(0,201,167,.08);border:1px solid rgba(0,201,167,.25);
      border-radius:8px;padding:10px 14px;margin-top:10px;
    }
    .upload-preview.show{display:flex;}
    .upload-preview-name{font-size:13px;color:var(--teal);flex:1;}

    /* Error / hint */
    .field-error{font-size:12px;color:var(--red);margin-top:6px;display:none;}
    .field-error.show{display:block;}

    /* ── SUCCESS SCREEN ──────────────────────── */
    .success-screen{
      text-align:center;padding:48px 20px;
    }
    .success-icon{font-size:56px;margin-bottom:20px;}
    .success-title{font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:10px;}
    .success-sub{font-size:15px;color:var(--sub);line-height:1.65;margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto;}

    .success-steps{
      background:var(--card);border:1px solid var(--border);
      border-radius:12px;padding:20px;max-width:400px;
      margin:0 auto 28px;text-align:left;
    }
    .success-step{
      display:flex;gap:10px;padding:8px 0;
      border-bottom:1px solid var(--border);font-size:13px;color:var(--sub);
    }
    .success-step:last-child{border-bottom:none;}
    .success-step-icon{font-size:16px;flex-shrink:0;}

    /* ── LOADER ──────────────────────────────── */
    .loader-overlay{
      position:fixed;inset:0;background:var(--bg);z-index:400;
      display:flex;align-items:center;justify-content:center;
    }
    .loader-overlay.out{display:none;}
    .spinner{width:36px;height:36px;border:2px solid var(--border);
      border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:600px){
      nav{padding:12px 16px;}
      .page{padding:20px 14px;}
      .pricing-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-mark" id="logoMark">Sp</div>
    <span class="logo-text">Speak<span>glish</span></span>
  </a>
  <a href="dashboard.html" class="btn btn-ghost">← Dashboard</a>
</nav>

<div class="page" id="page"></div>

<script>
  const sb = supabase.createClient(
    'https://iugggbzgrucopvxkgzry.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1Z2dnYnpncnVjb3B2eGtnenJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTMyMDAsImV4cCI6MjA5NTgyOTIwMH0.Z1wosmmuipQS-KjWnKJRhOoXXgYzvEMy13Uah011Vw0'
  );

  // ─── STATE ────────────────────────────────────────────────────
  let userId     = null;
  let profile    = null;
  let market     = 'dz';
  let config     = null;
  let selectedPlan = null;
  let receiptFile  = null;
  let receiptUrl   = null;

  const PLAN_KEYS = ['1month','3months','6months'];

  // ─── TRANSLATIONS ─────────────────────────────────────────────
  const T = {
    dz:{
      payTitle:'💳 How to Pay',
      step1Title:'Transfer the exact amount',
      step1Desc:'Send the exact amount via CCP transfer to the following account:',
      step2Title:'Write your reference',
      step2Desc:'Include your registered email as the transfer reference/note so we can identify your payment.',
      step3Title:'Upload your receipt',
      step3Desc:'Take a photo or screenshot of your transfer receipt and upload it below.',
      uploadText:'Click to upload receipt',
      uploadHint:'Photo or screenshot · JPG, PNG or PDF',
      submitBtn:'Submit Payment →',
      method:'CCP Transfer',
    },
    tr:{
      payTitle:'💳 Nasıl Ödeme Yapılır',
      step1Title:'Tam tutarı transfer edin',
      step1Desc:'Aşağıdaki banka hesabına tam tutarı transfer edin:',
      step2Title:'Referansınızı yazın',
      step2Desc:'Transfer açıklamasına kayıtlı e-posta adresinizi yazın.',
      step3Title:'Dekontunuzu yükleyin',
      step3Desc:'Transfer dekontu fotoğrafını veya ekran görüntüsünü yükleyin.',
      uploadText:'Dekont yüklemek için tıklayın',
      uploadHint:'Fotoğraf veya ekran görüntüsü · JPG, PNG veya PDF',
      submitBtn:'Ödemeyi Gönder →',
      method:'Banka Transferi',
    }
  };

  const PLAN_LABELS = {
    dz:{ '1month':'1 Mois', '3months':'3 Mois', '6months':'6 Mois', popular:'⭐ Le plus populaire' },
    tr:{ '1month':'1 Ay', '3months':'3 Ay', '6months':'6 Ay', popular:'⭐ En Popüler' },
  };

  const FEATURES = {
    dz:['Accès à tous les examens','Feedback IA sur l\'écrit','Leçons par compétence','Recommandations YouTube','Suivi de progression'],
    tr:['Tüm sınavlara erişim','AI yazma geri bildirimi','Konu bazlı dersler','YouTube önerileri','İlerleme takibi'],
  };

  // ─── RENDER MAIN PAGE ─────────────────────────────────────────
  function renderPage() {
    const status = profile?.subscription_status || 'trial';
    const t = T[market];
    const labels = PLAN_LABELS[market];
    const feats  = FEATURES[market];

    const prices = {
      '1month':  config?.price_1month  || (market==='dz'?1500:300),
      '3months': config?.price_3months || (market==='dz'?3500:700),
      '6months': config?.price_6months || (market==='dz'?5500:1200),
    };
    const currency = config?.currency || (market==='dz'?'DZD':'TRY');

    // Status badge
    const badgeMap = {
      trial:   ['badge-trial',   market==='dz'?'Essai gratuit':'Ücretsiz Deneme'],
      active:  ['badge-active',  market==='dz'?'Abonnement actif':'Aktif Abonelik'],
      expired: ['badge-expired', market==='dz'?'Abonnement expiré':'Süresi Doldu'],
      pending: ['badge-pending', market==='dz'?'Paiement en attente':'Ödeme Beklemede'],
    };
    const [badgeCls, badgeLabel] = badgeMap[status] || badgeMap.trial;

    // Status message
    const statusMsg = {
      trial:   { icon:'🎯', title: market==='dz'?'Passez à l\'accès complet':'Tam Erişime Geçin',
                 sub: market==='dz'?'Débloquez tous les examens, le feedback IA et le suivi de progression.':'Tüm sınavları, AI geri bildirimi ve ilerleme takibini açın.' },
      expired: { icon:'⏰', title: market==='dz'?'Votre abonnement a expiré':'Aboneliğiniz Sona Erdi',
                 sub: market==='dz'?'Renouvelez pour reprendre votre préparation.':'Hazırlığınıza devam etmek için yenileyin.' },
      active:  { icon:'✅', title: market==='dz'?'Abonnement actif':'Aktif Abonelik',
                 sub: `${market==='dz'?'Expire le':'Son tarih'}: ${profile?.subscription_end ? new Date(profile.subscription_end).toLocaleDateString() : '—'}` },
    }[status] || statusMsg?.trial;

    // Pending state - different render
    if (status === 'pending') {
      document.getElementById('page').innerHTML = `
        <div class="status-card">
          <div class="status-icon">⏳</div>
          <div class="status-info">
            <div class="status-title">${market==='dz'?'Paiement en cours de vérification':'Ödeme Doğrulanıyor'}</div>
            <div class="status-sub">${market==='dz'?'Votre paiement a été soumis et sera activé sous 24 heures.':'Ödemeniz gönderildi, 24 saat içinde aktif edilecek.'}</div>
          </div>
          <span class="status-badge badge-pending">${badgeLabel}</span>
        </div>
        <div class="pending-notice">
          <div class="pending-icon">🕐</div>
          <div class="pending-title">${market==='dz'?'Activation en cours...':'Aktivasyon Devam Ediyor...'}</div>
          <div class="pending-sub">
            ${market==='dz'
              ?'Votre paiement est en cours de vérification. Votre compte sera activé dans les 24 heures suivant la réception de votre reçu.'
              :'Ödemeniz doğrulanıyor. Dekontunuz alındıktan sonra hesabınız 24 saat içinde aktif edilecek.'}
            <br><br>
            ${market==='dz'?'Des questions ? Contactez-nous sur WhatsApp.':'Sorularınız mı var? WhatsApp\'tan bize ulaşın.'}
          </div>
        </div>
        <div style="text-align:center;">
          <a href="dashboard.html" class="btn btn-primary">← ${market==='dz'?'Retour au tableau de bord':'Kontrol Paneline Dön'}</a>
        </div>`;
      return;
    }

    let html = `
      <div class="status-card">
        <div class="status-icon">${statusMsg?.icon||'🎯'}</div>
        <div class="status-info">
          <div class="status-title">${statusMsg?.title||''}</div>
          <div class="status-sub">${statusMsg?.sub||''}</div>
        </div>
        <span class="status-badge ${badgeCls}">${badgeLabel}</span>
      </div>

      <div class="section-title">${market==='dz'?'Choisissez votre plan':'Planınızı Seçin'}</div>
      <div class="section-sub">${market==='dz'?'Paiement par virement CCP · Activation sous 24h':'Kolay ödeme · 24 saat içinde aktivasyon'}</div>

      <div class="pricing-grid">`;

    PLAN_KEYS.forEach(key => {
      const featured = key === '3months';
      const price    = prices[key];
      html += `
        <div class="price-card ${featured?'featured':''}" id="card-${key}" onclick="selectPlan('${key}')">
          ${featured?`<div class="popular-tag">${labels.popular}</div>`:''}
          <div class="plan-duration">${labels[key]}</div>
          <div class="plan-price">${price.toLocaleString()}</div>
          <div class="plan-currency">${currency}</div>
          <ul class="plan-features">
            ${feats.map(f=>`<li>${f}</li>`).join('')}
          </ul>
          <button class="select-btn ${featured?'select-btn-featured':'select-btn-default'}" id="selbtn-${key}">
            ${market==='dz'?'Choisir →':'Seç →'}
          </button>
        </div>`;
    });

    html += `</div>`;

    // Payment section (initially hidden)
    const ccpNum  = config?.ccp_number  || '— Configure in Admin Panel —';
    const ccpName = config?.ccp_name    || 'Speaglish';

    html += `
      <div class="payment-section" id="paymentSection" style="display:none;">
        <div class="payment-title">💳 ${t.payTitle}</div>

        <div class="selected-plan-summary">
          <div>
            <div class="summary-plan" id="summaryPlan">—</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${t.method}</div>
          </div>
          <div class="summary-amount" id="summaryAmount">—</div>
        </div>

        <div class="steps">
          <div class="step">
            <div class="step-num">1</div>
            <div class="step-content">
              <div class="step-title">${t.step1Title}</div>
              <div class="step-desc">${t.step1Desc}</div>
              <div class="step-highlight">
                <div>
                  <div style="font-size:11px;color:var(--muted);margin-bottom:2px;">${market==='dz'?'Numéro CCP':'Hesap No'}</div>
                  <div id="ccpNum">${ccpNum}</div>
                </div>
                <button class="copy-btn" onclick="copyText('${ccpNum}')">Copy</button>
              </div>
              <div class="step-highlight" style="margin-top:8px;">
                <div>
                  <div style="font-size:11px;color:var(--muted);margin-bottom:2px;">${market==='dz'?'Nom du compte':'Hesap Adı'}</div>
                  <div>${ccpName}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="step">
            <div class="step-num">2</div>
            <div class="step-content">
              <div class="step-title">${t.step2Title}</div>
              <div class="step-desc">${t.step2Desc}</div>
              <div class="step-highlight">
                <span id="userEmailDisplay" style="color:var(--gold);">your@email.com</span>
                <button class="copy-btn" onclick="copyText(document.getElementById('userEmailDisplay').textContent)">Copy</button>
              </div>
            </div>
          </div>

          <div class="step">
            <div class="step-num">3</div>
            <div class="step-content">
              <div class="step-title">${t.step3Title}</div>
              <div class="step-desc">${t.step3Desc}</div>
              <div class="upload-area" onclick="document.getElementById('receiptInput').click()">
                <input type="file" id="receiptInput" accept="image/*,.pdf" onchange="handleReceiptUpload(this)">
                <div class="upload-icon">📎</div>
                <div class="upload-text">${t.uploadText}</div>
                <div class="upload-hint">${t.uploadHint}</div>
              </div>
              <div class="upload-preview" id="uploadPreview">
                <span>✅</span>
                <span class="upload-preview-name" id="uploadFileName"></span>
                <button class="copy-btn" onclick="clearReceipt()" style="color:var(--red);border-color:rgba(255,87,87,.3);">Remove</button>
              </div>
              <div class="field-error" id="uploadError">Please upload your receipt before submitting.</div>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="submitBtn" onclick="submitPayment()">
          ${t.submitBtn}
        </button>

        <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:14px;">
          ${market==='dz'?'Votre compte sera activé dans les 24 heures suivant la vérification.':'Hesabınız doğrulama sonrasında 24 saat içinde aktif edilecek.'}
        </p>
      </div>`;

    document.getElementById('page').innerHTML = html;
  }

  // ─── SELECT PLAN ──────────────────────────────────────────────
  function selectPlan(key) {
    selectedPlan = key;
    const prices = {
      '1month':  config?.price_1month  || (market==='dz'?1500:300),
      '3months': config?.price_3months || (market==='dz'?3500:700),
      '6months': config?.price_6months || (market==='dz'?5500:1200),
    };
    const currency  = config?.currency || (market==='dz'?'DZD':'TRY');
    const labels    = PLAN_LABELS[market];
    const price     = prices[key];

    // Update button states
    PLAN_KEYS.forEach(k => {
      const btn = document.getElementById(`selbtn-${k}`);
      const card = document.getElementById(`card-${k}`);
      if (!btn || !card) return;
      if (k === key) {
        btn.className = 'select-btn select-btn-selected';
        btn.textContent = market==='dz'?'✓ Sélectionné':'✓ Seçildi';
        card.classList.add('selected');
      } else {
        btn.className = k==='3months'?'select-btn select-btn-featured':'select-btn select-btn-default';
        btn.textContent = market==='dz'?'Choisir →':'Seç →';
        card.classList.remove('selected');
      }
    });

    // Show payment section
    const section = document.getElementById('paymentSection');
    if (section) {
      section.style.display = 'block';
      document.getElementById('summaryPlan').textContent = labels[key];
      document.getElementById('summaryAmount').textContent = `${price.toLocaleString()} ${currency}`;
      section.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }

  // ─── RECEIPT UPLOAD ───────────────────────────────────────────
  function handleReceiptUpload(input) {
    const file = input.files[0];
    if (!file) return;
    receiptFile = file;
    document.getElementById('uploadPreview').classList.add('show');
    document.getElementById('uploadFileName').textContent = file.name;
    document.getElementById('uploadError').classList.remove('show');
  }

  function clearReceipt() {
    receiptFile = null; receiptUrl = null;
    document.getElementById('receiptInput').value = '';
    document.getElementById('uploadPreview').classList.remove('show');
  }

  // ─── SUBMIT PAYMENT ───────────────────────────────────────────
  async function submitPayment() {
    if (!receiptFile) {
      document.getElementById('uploadError').classList.add('show');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.textContent = '⏳ Submitting...'; btn.disabled = true;

    try {
      // Upload receipt to Supabase Storage
      const ext  = receiptFile.name.split('.').pop();
      const path = `receipts/${userId}/${Date.now()}.${ext}`;

      const { error: uploadErr } = await sb.storage
        .from('landing-assets')
        .upload(path, receiptFile, { upsert: true });

      if (!uploadErr) {
        const { data: { publicUrl } } = sb.storage
          .from('landing-assets').getPublicUrl(path);
        receiptUrl = publicUrl;
      }

      // Save subscription request
      const prices = {
        '1month':  config?.price_1month  || (market==='dz'?1500:300),
        '3months': config?.price_3months || (market==='dz'?3500:700),
        '6months': config?.price_6months || (market==='dz'?5500:1200),
      };

      await sb.from('subscriptions').insert({
        student_id:     userId,
        plan_type:      selectedPlan,
        amount:         prices[selectedPlan],
        currency:       config?.currency || (market==='dz'?'DZD':'TRY'),
        market:         market,
        payment_method: market==='dz'?'ccp':'bank_transfer',
        receipt_url:    receiptUrl,
        status:         'pending',
      });

      // Update profile to pending
      await sb.from('profiles').update({
        subscription_status: 'pending'
      }).eq('id', userId);

      showSuccess();
    } catch(e) {
      btn.textContent = market==='dz'?'Soumettre →':'Gönder →';
      btn.disabled = false;
      alert('Error: ' + e.message);
    }
  }

  // ─── SUCCESS SCREEN ───────────────────────────────────────────
  function showSuccess() {
    document.getElementById('page').innerHTML = `
      <div class="success-screen">
        <div class="success-icon">🎉</div>
        <div class="success-title">${market==='dz'?'Paiement soumis !':'Ödeme Gönderildi!'}</div>
        <div class="success-sub">
          ${market==='dz'
            ?'Votre reçu a été reçu. Votre compte sera activé dans les 24 heures. Vous recevrez une notification dès l\'activation.'
            :'Dekontunuz alındı. Hesabınız 24 saat içinde aktif edilecek. Aktivasyon sonrasında bildirim alacaksınız.'}
        </div>
        <div class="success-steps">
          <div class="success-step">
            <span class="success-step-icon">✅</span>
            <span>${market==='dz'?'Reçu reçu et en cours de vérification':'Dekont alındı ve doğrulanıyor'}</span>
          </div>
          <div class="success-step">
            <span class="success-step-icon">⏳</span>
            <span>${market==='dz'?'Activation sous 24 heures':'24 saat içinde aktivasyon'}</span>
          </div>
          <div class="success-step">
            <span class="success-step-icon">🔓</span>
            <span>${market==='dz'?'Accès complet débloqué après activation':'Aktivasyon sonrası tam erişim açılacak'}</span>
          </div>
        </div>
        <a href="dashboard.html" class="btn btn-primary btn-lg">
          ← ${market==='dz'?'Retour au tableau de bord':'Kontrol Paneline Dön'}
        </a>
      </div>`;
  }

  // ─── COPY TEXT ────────────────────────────────────────────────
  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('Copied!');
    });
  }

  // ─── INIT ─────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    userId = session.user.id;

    // Load profile
    const { data: p } = await sb.from('profiles').select('*').eq('id', userId).single();
    profile = p || {};
    market  = profile.market || localStorage.getItem('sp_market') || 'dz';

    // Load config
    const { data: cfg } = await sb.from('landing_config')
      .select('*').eq('market', market).single();
    config = cfg;

    // Set user email
    setTimeout(() => {
      const emailEl = document.getElementById('userEmailDisplay');
      if (emailEl) emailEl.textContent = session.user.email;
    }, 100);

    // Load logo
    if (cfg?.logo_url) {
      document.getElementById('logoMark').innerHTML =
        `<img src="${cfg.logo_url}" style="width:100%;height:100%;object-fit:contain;">`;
    }

    renderPage();

    // Set email after render
    setTimeout(() => {
      const emailEl = document.getElementById('userEmailDisplay');
      if (emailEl) emailEl.textContent = session.user.email;
    }, 200);

    document.getElementById('loaderOverlay').classList.add('out');
  }

  init();
</script>
</body>
</html>
